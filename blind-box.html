<script>
/* ================= SHA-256（用于款式配置指纹，离线可用） ================= */
var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636b,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function rotr(x,n){return ((x>>>n)|(x<<(32-n)))>>>0;}
function sha256(msg){
  var bytes=new TextEncoder().encode(msg), l=bytes.length;
  var blocks=Math.ceil((l+9)/64), pad=new Uint8Array(blocks*64);
  pad.set(bytes); pad[l]=0x80;
  var bits=l*8, hi=Math.floor(bits/4294967296), lo=bits%4294967296;
  pad[pad.length-8]=(hi>>>24)&255; pad[pad.length-7]=(hi>>>16)&255;
  pad[pad.length-6]=(hi>>>8)&255;  pad[pad.length-5]=hi&255;
  pad[pad.length-4]=(lo>>>24)&255; pad[pad.length-3]=(lo>>>16)&255;
  pad[pad.length-2]=(lo>>>8)&255; pad[pad.length-1]=lo&255;
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var w=new Uint32Array(64);
  for(var b=0;b<blocks;b++){
    var o=b*64, t;
    for(t=0;t<16;t++) w[t]=((pad[o+t*4]<<24)|(pad[o+t*4+1]<<16)|(pad[o+t*4+2]<<8)|pad[o+t*4+3])>>>0;
    for(t=16;t<64;t++){
      var s0=rotr(w[t-15],7)^rotr(w[t-15],18)^(w[t-15]>>>3);
      var s1=rotr(w[t-2],17)^rotr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    var a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(t=0;t<64;t++){
      var S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      var ch=(e&f)^((~e)&g);
      var t1=(h+S1+ch+K[t]+w[t])>>>0;
      var S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      var mj=(a&bb)^(a&c)^(bb&c);
      var t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+bb)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  var out='';
  for(var i=0;i<8;i++) out+=('0000000'+H[i].toString(16)).slice(-8);
  return out;
}

/* ================= 状态 ================= */
var KEY='blindbox_demo_v2';
var STYLES=['夜航','潮汐','拾光','雾岛','归舟','白露','长夏','霜降','听风','拂晓','静默','远山'];
var HUE=[212,196,28,258,16,340,44,174,262,96,318,190];

function defaults(){
  return {
    cfg:{ id:'BB-2026-01', name:'星野系列', price:399, limitPerOrder:6,
          hiddenDenom:144, dropQty:500, valueLow:399, valueHigh:899, status:'live' },
    styles:null, orders:[], log:[]
  };
}
function freshStyles(hiddenDenom){
  var a=STYLES.map(function(s,i){
    return { code:'N'+(i+1), name:'星野 · '+s, tier:'normal', weight:143, hue:HUE[i] };
  });
  a.push({ code:'H1', name:'星野 · 极光（隐藏款）', tier:'hidden', weight:12, hue:275 });
  return a;
}
function firstRun(){
  var d=defaults();
  d.styles=freshStyles(d.cfg.hiddenDenom);
  /* 预置 6 笔订单：3 笔已全开、1 笔部分开、1 笔未开、1 笔全部未开 */
  d.orders=[
    mkOrder(d,'2026-10-02T14:22:00',3,true),
    mkOrder(d,'2026-10-02T18:05:00',2,true),
    mkOrder(d,'2026-10-03T09:41:00',6,true),
    mkOrder(d,'2026-10-03T10:12:00',4,false),
    mkOrder(d,'2026-10-03T11:30:00',1,false),
    mkOrder(d,'2026-10-03T13:58:00',5,false)
  ];
  return d;
}
var SEQ=0;
function mkOrder(st,ts,qty,opened){
  var d=new Date(ts);
  var pad=function(n){ return n<10?'0'+n:''+n; };
  var no='BB-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());
  var o={ no:no+(++SEQ), ts:new Date(ts).getTime(), qty:qty,
          unitPrice:st.cfg.price, amount:st.cfg.price*qty,
          status:'paid', slots:[] };
  if(opened) openAll(st,o);
  return o;
}
var S = load();
function load(){
  var v=null;
  try{ v=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!v||!v.styles) return firstRun();
  if(v.cfg.hiddenDenom===undefined) v.cfg.hiddenDenom=144;
  return v;
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function now(){ return Date.now(); }
function fmt(ms){ return new Date(ms).toLocaleString('zh-CN'); }
function hex(n){ var s=''; for(var i=0;i<n;i++) s+='0123456789abcdef'[Math.floor(Math.random()*16)]; return s; }

function totalWeight(st){
  return st.styles.reduce(function(a,s){ return a+s.weight; },0);
}
function probOf(st,code){
  var s=st.styles.filter(function(x){return x.code===code;})[0];
  if(!s) return 0;
  return s.weight/totalWeight(st);
}
/* 概率口径：隐藏款 1/N；常规款按"总量比 N-1 : 1"均分后的约数展示 */
function tierLabel(st,s){
  if(s.tier==='hidden') return '1/'+st.cfg.hiddenDenom;
  return '约 1/'+Math.max(1,Math.round(st.cfg.hiddenDenom*1/12));
}
function pickOne(st){
  var tot=totalWeight(st), r=Math.random()*tot, acc=0;
  for(var i=0;i<st.styles.length;i++){
    acc+=st.styles[i].weight;
    if(r<acc) return st.styles[i];
  }
  return st.styles[st.styles.length-1];
}
function openAll(st,o){
  ensureSlots(o);
  for(var i=0;i<o.qty;i++) openSlot(st,o,i);
}
/* slots 槽位式：每个盒子独立记录，slots[i] 为 null 表示第 i 盒未开。
   支持任意顺序开盒，已开结果不会被后续操作覆盖。 */
function openSlot(st,o,i){
  if(i<0 || i>=o.qty) return false;
  if(!o.slots) o.slots=[];
  if(o.slots[i]) return false;          /* 已开过，不覆盖 */
  var s=pickOne(st);
  o.slots[i]={ code:s.code, name:s.name, tier:s.tier, hue:s.hue,
               p:+(probOf(st,s.code)*100).toFixed(3), ts:now() };
  return true;
}
function openedCount(o){ return (o.slots||[]).filter(function(x){ return x; }).length; }
function openedItems(o){ return (o.slots||[]).filter(function(x){ return x; }); }
/* 兼容旧结构（预置数据用 push） */
function ensureSlots(o){
  if(!o.slots){ o.slots=[]; }
  (o.items||[]).forEach(function(it){
    var k=o.slots.indexOf(null);
    if(k<0) o.slots.push(it); else o.slots[k]=it;
  });
  o.items=null;
  return o.slots;
}
function collection(){
  var m={};
  S.orders.forEach(function(o){
    openedItems(ensureSlots(o)).forEach(function(it){ m[it.code]=(m[it.code]||0)+1; });
  });
  return m;
}
function orderStatusTxt(o){
  var n=openedCount(o);
  if(n===0) return { t:'待开盒', c:'' };
  if(n<o.qty) return { t:'部分开盒', c:'wait' };
  return { t:'已开完', c:'ok' };
}

/* 公示一致性自检：公示口径与实际权重必须对得上，否则属虚假公示 */
function audit(){
  var h=S.styles.filter(function(s){return s.tier==='hidden';})[0];
  if(!h) return '<div class="msg err">公示一致性自检：当前无隐藏款，但公示口径声明为 1/'+S.cfg.hiddenDenom+'，两者不符。</div>';
  var actual=h.weight/totalWeight(S)*100;
  var claimed=100/S.cfg.hiddenDenom;
  var dev=Math.abs(actual-claimed)/claimed*100;
  if(dev>5){
    return '<div class="msg err"><b>公示一致性自检 · 未通过</b><br>'
      + '公示口径 1/'+S.cfg.hiddenDenom+'（'+claimed.toFixed(3)+'%），但按当前权重实际为 '+actual.toFixed(3)
      + '%，偏差 '+dev.toFixed(1)+'%。<br>这在合规上等同于虚假公示——必须调整隐藏款权重至约 '
      + Math.round(totalWeight(S)/S.cfg.hiddenDenom)+'，或把分母改回 '+Math.round(100/actual)+'。</div>';
  }
  return '<div class="msg ok"><b>公示一致性自检 · 通过</b>｜公示 1/'+S.cfg.hiddenDenom
    +'（'+claimed.toFixed(3)+'%），实际 '+actual.toFixed(3)+'%，偏差 '+dev.toFixed(2)+'%。</div>';
}

   +   '<div><label>隐藏款权重</label><input id="hw" type="number" value="'+(S.styles.filter(function(s){return s.tier==='hidden';})[0]||{weight:12}).weight+'"></div>'
   +   '<div><label>常规款权重（每款）</label><input id="nw" type="number" value="'+(S.styles.filter(function(s){return s.tier==='normal';})[0]||{weight:143}).weight+'"></div>'
   +   '<div><label>&nbsp;</label><button id="doProb" class="btn primary">应用概率</button></div>'
   + '</div>'
   + '<div class="row" style="margin-top:4px">'
   +   '<div><label>新增款式 · 名称</label><input id="nn" placeholder="如 星野 · 新芽"></div>'
   +   '<div><label>新增款式 · 档位</label><select id="nt"><option value="normal">常规款</option><option value="hidden">隐藏款</option></select></div>'
   +   '<div><label>新增款式 · 权重</label><input id="nw2" type="number" value="143"></div>'
   +   '<div><label>&nbsp;</label><button id="doAddSt" class="btn">新增款式</button></div>'
   + '</div>'
   + (FB?'<div class="msg ok">'+FB+'</div>':'')
   + '<div class="scroll" style="margin-top:12px"><table><thead><tr><th>编号</th><th>名称</th><th>档位</th><th>权重</th><th>实际占比</th><th>公示口径</th><th>操作</th></tr></thead><tbody>'
   + rows+'</tbody></table></div>'
   + '<h3>款式配置指纹（公示留痕）</h3><code>'+fp+'</code>'
   + '<p class="hint">权重合计 '+tot+'。指纹随任一款式名称 / 档位 / 权重或隐藏款分母变化而变化，可用于比对公示是否被事后篡改。</p>'
   + '<div class="pbox" style="margin-top:12px"><h3 style="margin-top:0">概率口径设计说明（仅运营侧可见）</h3>'
   + '<div class="pline"><span>对外公示口径</span><span>总量比 '+(cfg.hiddenDenom-1)+' : 1，常规款在合计份额内均分</span></div>'
   + '<div class="pline"><span>不可用的写法</span><span>「12 款各 1/12，再加隐藏款 1/144」</span></div>'
   + '<div class="pline"><span>原因</span><span>12×1/12 = 100%，再加隐藏款后总和大于 100%，属公示口径自相矛盾</span></div>'
   + '<div class="pline"><span>正确做法</span><span>常规款合计占 143/144，隐藏款占 1/144，常规款在 143 份内均分</span></div>'
   + '<div class="pline"><span>投放量参考</span><span>当前 '+cfg.dropQty+' 盒，理论期望约 '+(cfg.dropQty/cfg.hiddenDenom).toFixed(1)+' 盒出一只隐藏款</span></div>'
   + '<p class="hint" style="margin-top:8px">以上推导过程属内部设计说明，不对 C 端展示——C 端只呈现最终口径与实际占比，避免用户看到推导过程后产生"概率算错了"的误解。</p></div>'
   + '<div class="row" style="margin-top:10px">'
   +   '<div><label>系列名称</label><input id="cn" value="'+cfg.name+'"></div>'
   +   '<div><label>单盒售价</label><input id="cp" type="number" value="'+cfg.price+'"></div>'
   +   '<div><label>投放总量</label><input id="cd2" type="number" value="'+cfg.dropQty+'"></div>'
   +   '<div><label>单次限购</label><input id="cl" type="number" value="'+cfg.limitPerOrder+'"></div>'
   +   '<div><label>&nbsp;</label><button id="doCfg" class="btn">保存系列配置</button></div>'
   + '</div>'
   + '<button id="doReset" class="btn danger" style="margin-top:14px">恢复演示数据（清空订单与款式改动）</button>'
   + '</div>';
}

function exportText(){
  var L=[ '商品：'+S.cfg.name+' 盲盒', '订单数：'+S.orders.length, '' ];
  L.push('订单号｜时间｜盒数｜金额｜已开｜款式');
  S.orders.slice().sort(function(a,b){return b.ts-a.ts;}).forEach(function(o){
    var oc=openedCount(o);
    var n=oc?openedItems(o).map(function(x){return x.name;}).join('、'):'—';
    L.push(o.no+' ｜ '+fmt(o.ts)+' ｜ '+o.qty+' ｜ ¥'+o.amount+' ｜ '+oc+'/'+o.qty+' ｜ '+n);
  });
  L.push('', '注：本导出用于客服核对与对账；款式价值与概率见公示页。');
  return L.join('\n');
}

/* ================= 事件绑定 ================= */
function bindUser(){
  var g=function(x){ return document.getElementById(x); };
  if(g('goPay')){
    var mn=1, mx=S.cfg.limitPerOrder, cur=QTY();
    if(cur<mn){ cur=mn; setQty(mn); }
    if(cur>mx){ cur=mx; setQty(mx); }
    g('qMinus').disabled = (cur<=mn);
    g('qPlus').disabled  = (cur>=mx);
    g('qMinus').onclick=function(){ if(cur>mn){ cur--; setQty(cur); render(); } };
    g('qPlus').onclick =function(){ if(cur<mx){ cur++; setQty(cur); render(); } };
    g('goPay').onclick=function(){ pg='c2'; render(); };
    g('goRule').onclick=function(){ pg='c6'; render(); };
    if(g('adm')){
      g('adm').onclick=function(){
        var v=prompt('请输入运营后台口令');
        if(v===ADMIN_CODE||v===ADMIN_KEY){ adminOk=true; mode='admin'; pg='b1'; render(); }
      };
    }
  }
  if(g('back')) g('back').onclick=function(){ pg='c1'; render(); };
  if(g('pay')) g('pay').onclick=function(){
    var q=Math.min(S.cfg.limitPerOrder, Math.max(1,QTY()));
    var no=nextNo();
    S.orders.push({ no:no, ts:now(), qty:q, unitPrice:S.cfg.price, amount:S.cfg.price*q,
                    status:'paid', items:[], opened:0 });
    save(); pg='c3'; render();
  };
  if(g('go1')) g('go1').onclick=function(){ pg='c1'; render(); };
  if(g('go4')) g('go4').onclick=function(){ pg='c4'; render(); };
  if(g('go5')) g('go5').onclick=function(){ pg='c5'; render(); };
  document.querySelectorAll('.bx[data-i]').forEach(function(b){
    b.onclick=function(){
      var o=lastOrder(); if(!o) return;
      var i=parseInt(b.getAttribute('data-i'),10);
      ensureSlots(o);
      if(o.slots[i]) return;            /* 已开过，不重复也不覆盖 */
      openSlot(S,o,i); save(); render();
    };
  });
  document.querySelectorAll('[data-open]').forEach(function(b){
    b.onclick=function(){
      var no=b.getAttribute('data-open');
      var o=S.orders.filter(function(x){return x.no===no;})[0];
      if(!o) return;
      ensureSlots(o);
      for(var i=0;i<o.qty;i++) if(!o.slots[i]){ openSlot(S,o,i); break; }  /* 一次只开一盒 */
      save(); pg='c3'; render();
    };
  });
}

function bindAdmin(){
  var g=function(x){ return document.getElementById(x); };
  if(!adminOk) return;

  if(g('doF')){
    g('doF').onclick=function(){
      FLT.q=g('fq').value.trim(); FLT.from=g('ff').value; FLT.to=g('ft').value;
      FLT.status=g('fs').value; FB=''; render();
    };
    g('doAdd').onclick=function(){
      var q=Math.max(1,Math.min(S.cfg.limitPerOrder,parseInt(g('nq').value,10)||1));
      var p=Math.max(0,parseInt(g('np').value,10)||S.cfg.price);
      var no=nextNo();
      S.orders.push({ no:no, ts:now(), qty:q, unitPrice:p, amount:p*q, status:'paid', items:[], opened:0 });
      save(); FB='已新增订单 '+no+'（'+q+' 盒，¥'+(p*q)+'）'; render();
    };
    g('doClr').onclick=function(){
      if(!confirm('清空全部 '+S.orders.length+' 条订单？\n款式配置会保留。')) return;
      S.orders=[]; save(); FB='已清空全部订单'; render();
    };
    g('doExp').onclick=function(){
      EXPORT=exportText();
      FB='导出内容已生成于下方文本框，可直接复制';
      render();
      var t=document.getElementById('exp');
      if(t){
        t.style.display='block';
        try{ t.focus(); t.select(); document.execCommand('copy'); FB='导出内容已生成并已复制到剪贴板'; render(); }
        catch(e){}
      }
    };
    document.querySelectorAll('[data-save]').forEach(function(b){
      b.onclick=function(){
        var no=b.getAttribute('data-save');
        var o=S.orders.filter(function(x){return x.no===no;})[0]; if(!o) return;
        document.querySelectorAll('[data-no="'+no+'"]').forEach(function(inp){
          var f=inp.getAttribute('data-f');
          if(f==='qty') o.qty=Math.max(1,parseInt(inp.value,10)||1);
          if(f==='amount') o.amount=Math.max(0,parseFloat(inp.value,10)||0);
        });
        save(); FB='已保存 '+no; render();
      };
    });
    document.querySelectorAll('[data-del]').forEach(function(b){
      b.onclick=function(){
        var no=b.getAttribute('data-del');
        if(!confirm('删除订单 '+no+'？该操作不可撤销。')) return;
        S.orders=S.orders.filter(function(x){return x.no!==no;});
        save(); FB='已删除 '+no; render();
      };
    });
    document.querySelectorAll('[data-open]').forEach(function(b){
      b.onclick=function(){
        var no=b.getAttribute('data-open');
        var o=S.orders.filter(function(x){return x.no===no;})[0]; if(!o) return;
        openAll(S,o);
        save(); FB='订单 '+no+' 已全部开盒（客服代开）'; render();
      };
    });
  }

  if(g('doProb')){
    g('doProb').onclick=function(){
      var n=Math.max(2,parseInt(g('hd').value,10)||144);
      var hw=Math.max(1,parseInt(g('hw').value,10)||12);
      var nw=Math.max(1,parseInt(g('nw').value,10)||143);
      /* 关键：分母是公示口径，权重才是真实概率来源。
         这里把隐藏款权重按 1/n 反算回总权重，保证「公示 1/N」与实际抽取概率一致，
         否则会出现公示写 1/200、实际抽出 0.52% 的虚假公示——这在合规上等于虚假宣传。 */
      S.cfg.hiddenDenom=n;
      S.styles.forEach(function(s){ s.weight = s.tier==='hidden'?hw:nw; });
      var totNow=totalWeight(S), hidden=S.styles.filter(function(s){return s.tier==='hidden';})[0];
      if(hidden){
        var expect=Math.max(1,Math.round(totNow/n));
        var actual=hidden.weight/totNow*100;
        FB='概率已应用：公示口径 1/'+n+'，隐藏款实际占比 '+actual.toFixed(3)+'%'
          + (Math.abs(actual* n - 100)>3 ? '。⚠ 权重与分母偏差过大，公示口径与实际不符，请调整权重' : '（与公示口径一致）');
        if(Math.abs(actual*n-100)>3) FB+='：建议隐藏款权重设为 '+expect+'（常规款每款权重 '+Math.round(expect*(n-1)/12)+'）';
      }else{
        FB='概率已更新：常规款每款权重 '+nw+'。当前无隐藏款，请先在下方新增并把档位设为「隐藏款」。';
      }
      FB+=' 公示页缓存 5 分钟后生效。';
      save(); render();
    };
    g('doAddSt').onclick=function(){
      var nm=g('nn').value.trim();
      if(!nm){ FB='请填写款式名称'; render(); return; }
      if(S.styles.some(function(s){return s.name===nm;})){ FB='款式名称已存在'; render(); return; }
      var tier=g('nt').value, w=Math.max(1,parseInt(g('nw2').value,10)||143);
      S.styles.push({ code:'X'+hex(4).toUpperCase(), name:nm, tier:tier, weight:w,
                      hue:Math.floor(Math.random()*360) });
      save(); FB='已新增款式「'+nm+'」'; render();
    };
    g('doCfg').onclick=function(){
      S.cfg.name=g('cn').value.trim()||S.cfg.name;
      S.cfg.price=Math.max(0,parseInt(g('cp').value,10)||S.cfg.price);
      S.cfg.dropQty=Math.max(1,parseInt(g('cd2').value,10)||S.cfg.dropQty);
      S.cfg.limitPerOrder=Math.max(1,Math.min(12,parseInt(g('cl').value,10)||6));
      save(); FB='系列配置已保存'; render();
    };
    g('doReset').onclick=function(){
      if(!confirm('恢复演示数据？\n将清空全部订单并重置款式配置与概率。')) return;
      S=firstRun(); save(); FLT={q:'',from:'',to:'',status:''}; FB='已恢复演示数据'; render();
    };
    document.querySelectorAll('[data-stsave]').forEach(function(b){
      b.onclick=function(){
        var cd=b.getAttribute('data-stsave');
        var s=S.styles.filter(function(x){return x.code===cd;})[0]; if(!s) return;
        document.querySelectorAll('[data-cd="'+cd+'"]').forEach(function(inp){
          var f=inp.getAttribute('data-st');
          if(f==='name'&&inp.value.trim()) s.name=inp.value.trim();
          if(f==='tier') s.tier=inp.value;
          if(f==='weight') s.weight=Math.max(1,parseInt(inp.value,10)||1);
        });
        save(); FB='款式 '+cd+' 已保存，公示指纹已更新'; render();
      };
    });
    document.querySelectorAll('[data-stdel]').forEach(function(b){
      b.onclick=function(){
        var cd=b.getAttribute('data-stdel');
        var s=S.styles.filter(function(x){return x.code===cd;})[0];
        if(!confirm('删除款式「'+(s?s.name:cd)+'」？\n该款已有售出记录，删除后图鉴数据将无法对应。')) return;
        S.styles=S.styles.filter(function(x){return x.code!==cd;});
        save(); FB='已删除款式 '+cd; render();
      };
    });
  }
}

document.getElementById('mUser').onclick=function(){ mode='user'; if(!adminOk) pg='c1'; render(); };
document.getElementById('mAdmin').onclick=function(){ mode='admin'; pg='b1'; render(); };
render();
</script>
