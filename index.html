<script>
/* ================= SHA-256（纯 JS，离线可用） ================= */
var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function rotr(x,n){return ((x>>>n)|(x<<(32-n)))>>>0;}
function sha256(msg){
  var bytes=new TextEncoder().encode(msg), l=bytes.length;
  var blocks=Math.ceil((l+9)/64), pad=new Uint8Array(blocks*64);
  pad.set(bytes); pad[l]=0x80;
  var bits=l*8, hi=Math.floor(bits/4294967296), lo=bits%4294967296;
  pad[pad.length-8]=(hi>>>24)&255; pad[pad.length-7]=(hi>>>16)&255;
  pad[pad.length-6]=(hi>>>8)&255;  pad[pad.length-5]=hi&255;
  pad[pad.length-4]=(lo>>>24)&255; pad[pad.length-3]=(lo>>>16)&255;
  pad[pad.length-2]=(lo>>>8)&255;  pad[pad.length-1]=lo&255;
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var w=new Uint32Array(64);
  for(var b=0;b<blocks;b++){
    var o=b*64, t;
    for(t=0;t<16;t++) w[t]=((pad[o+t*4]<<24)|(pad[o+t*4+1]<<16)|(pad[o+t*4+2]<<8)|pad[o+t*4+3])>>>0;
    for(t=16;t<64;t++){
      var s0=rotr(w[t-15],7)^rotr(w[t-15],18)^(w[t-15]>>>3);
      var s1=rotr(w[t-2],17)^rotr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    var a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(t=0;t<64;t++){
      var S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      var ch=(e&f)^((~e)&g);
      var t1=(h+S1+ch+K[t]+w[t])>>>0;
      var S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      var mj=(a&bb)^(a&c)^(bb&c);
      var t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+bb)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  var out='';
  for(var i=0;i<8;i++) out+=('0000000'+H[i].toString(16)).slice(-8);
  return out;
}

/* ================= 状态 ================= */
var KEY='lottery_demo_v2';
function defaults(){
  return { act:{ id:'SALE-001', name:'星野系列 · 限量盲盒', stock:50, reserveHours:24,
                 payMin:15, salt:'SALT-2026-PUBLIC', start:null, end:null,
                 status:'draft', demoFast:false, showRate:true },
           res:[], draw:null, released:0, who:'NEW' };
}
/* ---- 合规公示数据（《盲盒经营行为规范指引（试行）》第九条：种类/样式/分布/投放量/抽取概率/价值范围） ---- */
var STYLES=['夜航','潮汐','拾光','雾岛','归舟','白露','长夏','霜降','听风','拂晓','静默','远山'];
var HIDDEN_NAME='星野 · 极光（隐藏款）', HIDDEN_PROB='1/144';
var VALUE_RANGE='¥399 ~ ¥899';
function styleList(){
  return STYLES.map(function(s){ return { n:'星野 · '+s, p:'1/12' }; });
}
/* ---- 热度档位：C 端不暴露精确人数，避免观望效应与卡点涌入；后台仍看精确值 ---- */
function heat(a,n){
  if(!n) return { cnt:'尚无人预约', tag:'—', label:'预计中签率', val:'—' };
  var cnt = n<10 ? '不足 10 人' : (Math.floor(n/10)*10)+'+ 人';
  var tag = n<=a.stock ? '名额充足' : (a.stock/n>=0.8 ? '名额较充足' : (a.stock/n>=0.3 ? '较热门' : '极热门'));
  if(n<=a.stock) return { cnt:cnt, tag:tag, label:'供需情况', val:'名额充足，预约即可参与' };
  return { cnt:cnt, tag:tag, label:'预计中签率',
           val: a.showRate ? (Math.min(1,a.stock/n)*100).toFixed(1)+'%' : '不公示（后台可开启）' };
}
/* 首次打开 / 重置后的默认态：预约开放中 + 预置示例预约，避免访客看到空页 */
var DEMO_NICK=['星野鹿','鲸落','阿橘','小满','山雀','拿铁','布丁','青柠','晚风','汤圆',
               '西瓜','可乐','柚子','木木','阿七','大熊','小柯','南栀','拾柒','咕咕'];
var DEMO_HD=['138','139','137','136','135','159','188','186','150','177','199','132'];
function hex(n){ var s=''; for(var i=0;i<n;i++) s+='0123456789abcdef'[Math.floor(Math.random()*16)]; return s; }
function demoRes(n,start,span){
  var out=[], t=now();
  for(var i=0;i<n;i++){
    var nick=DEMO_NICK[i%DEMO_NICK.length];
    if(i>=DEMO_NICK.length) nick+='·'+(Math.floor(i/DEMO_NICK.length)+1);
    var ph=DEMO_HD[i%DEMO_HD.length];
    while(ph.length<11) ph+=Math.floor(Math.random()*10);
    out.push({ rid:'RSV-DEMO'+('0000'+i).slice(-4),
      name:nick, phone:ph.slice(0,11),
      device:'DEV-'+hex(8),
      ts:Math.round(start+Math.random()*span),
      status:'reserved', payDeadline:null, demo:true });
  }
  return out.sort(function(a,b){ return a.ts-b.ts; });
}
function firstRun(){
  var d=defaults(), t=now(), span=8*3600*1000;
  d.act.start=t-span;
  d.act.end=t+16*3600*1000;      /* 与 reserveHours=24 对齐：已开放 8h，剩余 16h */
  d.act.status='open';
  d.act.demoSeed=true;
  d.res=demoRes(80,d.act.start,span);
  return d;
}
var S = load();
function load(){
  var v;
  try{ var raw=localStorage.getItem(KEY); v = raw?JSON.parse(raw):firstRun(); }catch(e){ v = firstRun(); }
  if(v.act.showRate===undefined) v.act.showRate=true;   /* 兼容旧存档 */
  return v;
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function now(){ return Date.now(); }
function payMs(){ return S.act.demoFast ? 60000 : S.act.payMin*60000; }
function rid(){ return 'RSV-'+Math.random().toString(16).slice(2,10).toUpperCase(); }
function claimCode(r){ return sha256(r.rid+'|'+S.act.salt).slice(0,6).toUpperCase(); }
function recompute(ids,seed,stock){
  var rank=ids.slice().sort(function(x,y){ return sha256(x+'|'+seed) < sha256(y+'|'+seed) ? -1 : 1; });
  return { rank:rank, winners:rank.slice(0,stock), waitlist:rank.slice(stock) };
}
function byRid(r){ return r.rid; }
function findRid(id){ return S.res.filter(function(r){return r.rid===id;})[0]; }
function releaseTimeout(){
  var t=now(), changed=[];
  S.res.forEach(function(r){
    if(r.status==='won' && r.payDeadline && t>r.payDeadline){
      r.status='released'; r.payDeadline=null; S.released++; changed.push(r.rid);
    }
  });
  if(!changed.length) return 0;
  var order={}; S.draw.rank.forEach(function(x,i){ order[x]=i; });
  changed.forEach(function(){
    var wait=S.res.filter(function(x){return x.status==='waiting';})
                  .sort(function(a,b){ return (order[a.rid]||1e9)-(order[b.rid]||1e9); });
    if(wait.length){ wait[0].status='won'; wait[0].payDeadline=now()+payMs(); wait[0].promoted=true; }
  });
  save(); return changed.length;
}
function payIt(r){ r.status='paid'; r.payDeadline=null; r.paidAt=now(); r.code=claimCode(r); r.issued=false; save(); }
var TXT={reserved:'已预约',won:'中签待支付',paid:'已支付',released:'超时释放',waiting:'候补中',lost:'未中签'};
function pill(s){ var c=s==='won'?'won':s==='paid'?'paid':s==='waiting'?'wait':s==='released'?'out':'';
  return '<span class="pill '+c+'">'+(TXT[s]||s)+'</span>'; }
function fmt(ms){ return new Date(ms).toLocaleString('zh-CN'); }
function mask(p){ return p.slice(0,3)+'****'+p.slice(7); }
function sortedStr(ids){ return ids.slice().sort().join('\n')+'|'+S.act.id; }
function devId(){ if(!localStorage.getItem('dev_id')) localStorage.setItem('dev_id','DEV-'+Math.random().toString(16).slice(2,10)); return localStorage.getItem('dev_id'); }

/* ================= C 端 · 用户界面 ================= */

    if(open){

function mmss(s){ var m=Math.floor(s/60), x=s%60; return (m<10?'0':'')+m+':'+(x<10?'0':'')+x; }

function bindUser(){
  var g=function(id){ return document.getElementById(id); };
  if(g('who')) g('who').onchange=function(){ S.who=this.value; save(); render(); };
  if(g('cRsv')) g('cRsv').onclick=function(){
    var phone=g('cPhone').value.trim(), dev=g('cDev').value.trim(), nick=g('cNick').value.trim();
    var m=g('cm');
    if(!/^\d{11}$/.test(phone)){ m.innerHTML='<div class="msg err">手机号必须是 11 位数字</div>'; return; }
    var dup=S.res.filter(function(r){ return r.phone===phone || r.device===dev; })[0];
    if(dup){ m.innerHTML='<div class="msg warn">该手机号或设备已预约过，无法重复参与</div>'; return; }
    var r={ rid:rid(), name:nick||'匿名', phone:phone, device:dev, ts:now(), status:'reserved', payDeadline:null };
    S.res.push(r); S.who=r.rid; save(); render();
  };
  if(g('cPay')) g('cPay').onclick=function(){ var me=findRid(S.who); if(me){ payIt(me); render(); } };
  if(g('adminLink')) g('adminLink').onclick=function(){
    var c=prompt('请输入管理口令');
    if(c===null) return;
    if(c===ADMIN_CODE){ isAdmin=true; localStorage.setItem('isAdmin','1'); mode='admin'; page='1'; render(); }
    else alert('口令不正确');
  };
}

  wait.forEach(function(r,i){ L.push((i+1)+'. '+r.rid+'  '+r.name+'  '+r.phone); });
  L.push('');
  L.push('注：含完整手机号，仅用于私聊通知与转账；对外截图前务必打码。');
  return L.join('\n');
}
function p6(){
  var paid=S.res.filter(function(r){return r.status==='paid';}).length;
  var wait=S.res.filter(function(r){return r.status==='waiting';}).length;
  var rate=S.draw&&S.draw.validCount ? (S.draw.winners.length/S.draw.validCount*100) : 0;
  var h='<div class="card"><h2>6 数据看板</h2><div class="grid">';
  h+='<div class="metric"><div class="n">'+S.res.length+'</div><div class="l">预约总数</div></div>';
  h+='<div class="metric"><div class="n">'+rate.toFixed(1)+'%</div><div class="l">中签率</div></div>';
  h+='<div class="metric"><div class="n">'+paid+'</div><div class="l">已支付</div></div>';
  h+='<div class="metric"><div class="n">'+wait+'</div><div class="l">候补中</div></div>';
  h+='<div class="metric"><div class="n">'+S.released+'</div><div class="l">超时释放</div></div>';
  h+='</div><div class="hint" style="margin-top:12px">若超时释放率 &gt; 25%，说明支付窗口设短了，下一版应上调——这就是 PRD 里「上线后验证方案」那一栏的原型。</div></div>';
  return h;
}

/* ================= 事件 ================= */
function bind(){
  nav.querySelectorAll('button').forEach(function(b){ b.onclick=function(){ page=b.dataset.p; render(); }; });
  var g=function(id){ return document.getElementById(id); };
  if(g('saveCfg')) g('saveCfg').onclick=function(){
    S.act.name=g('name').value;
    S.act.stock=parseInt(g('stock').value)||50;
    S.act.reserveHours=parseInt(g('hours').value)||24;
    S.act.payMin=parseInt(g('paymin').value)||15;
    S.act.salt=g('salt').value;
    S.act.demoFast=g('demo').checked;
    S.act.showRate=g('showrate').checked;
    S.act.start=now(); S.act.end=now()+S.act.reserveHours*3600000; S.act.status='open';
    save(); render();
  };
  if(g('stopRsv')) g('stopRsv').onclick=function(){ if(S.act.status==='open'){ S.act.status='closed'; S.act.end=now(); save(); render(); } };
  if(g('reset')) g('reset').onclick=function(){ if(confirm('清空全部数据，回到初始演示态？')){ S=firstRun(); save(); page='1'; render(); } };
  if(g('rsv')) g('rsv').onclick=function(){
    var m=g('m'), phone=g('phone').value.trim(), dev=g('dev').value.trim(), nick=g('nick').value.trim();
    if(!/^\d{11}$/.test(phone)){ m.innerHTML='<div class="msg err">手机号必须是 11 位数字</div>'; return; }
    var dup=S.res.filter(function(r){ return r.phone===phone || r.device===dev; })[0];
    if(dup){ m.innerHTML='<div class="msg warn">重复预约，已拦截。命中维度：'+(dup.phone===phone?'手机号相同':'设备 ID 相同')+'；原编号 '+dup.rid+'</div>'; return; }
    var r={ rid:rid(), name:nick||'匿名', phone:phone, device:dev, ts:now(), status:'reserved', payDeadline:null };
    S.res.push(r); save(); render();
  };
  if(g('loadDemo')) g('loadDemo').onclick=function(){
    S=defaults();
    var a=S.act; a.demoFast=true; a.start=now(); a.end=now(); a.status='closed';
    for(var k=0;k<80;k++) S.res.push({ rid:'RSV-TEST'+('000'+k).slice(-4), name:'测试用户'+k,
      phone:'1390000'+('0000'+k).slice(-4), device:'DEV-TEST'+('0000'+k).slice(-4),
      ts:now(), status:'reserved', payDeadline:null });
    var v=S.res.map(byRid), blob=sortedStr(v), seed=sha256(a.id+'|'+a.end+'|'+a.salt);
    var rr=recompute(v,seed,a.stock);
    S.res.forEach(function(x){
      if(rr.winners.indexOf(x.rid)>=0){ x.status='won'; x.payDeadline=now()+payMs(); }
      else if(rr.waitlist.indexOf(x.rid)>=0) x.status='waiting';
    });
    S.draw={ rosterBlob:blob, rosterHash:sha256(blob), seed:seed, drawTime:now(),
             rank:rr.rank, winners:rr.winners, waitlist:rr.waitlist,
             validCount:v.length, stock:a.stock };
    a.status='drawn'; save(); page='5'; render();
  };
  if(g('bulk')) g('bulk').onclick=function(){
    for(var i=0;i<80;i++) S.res.push({ rid:'RSV-TEST'+('000'+i).slice(-4), name:'测试用户'+i,
      phone:'1390000'+('0000'+i).slice(-4), device:'DEV-TEST'+('0000'+i).slice(-4),
      ts:now(), status:'reserved', payDeadline:null });
    save(); render();
  };
  if(g('clr')) g('clr').onclick=function(){
    if(!confirm('清空全部 '+S.res.length+' 条预约？\n配置（库存 / salt / 截止时间）保持不变。')) return;
    S.res=[]; S.draw=null; S.released=0; S.who='NEW'; S.act.demoSeed=false; IMPMSG=''; save(); render();
  };
  if(g('imp')) g('imp').onclick=function(){
    var lines=(g('impText').value||'').split(/\r?\n/);
    var ok=0, dup=0, bad=[];
    lines.forEach(function(ln){
      var s=ln.trim(); if(!s) return;
      var toks=s.split(/[,，、\t|]+/).map(function(x){return x.trim();}).filter(Boolean);
      var ph='';
      toks.forEach(function(x){ if(/^\d{11}$/.test(x.replace(/\D/g,''))) ph=x.replace(/\D/g,''); });
      if(!ph){ bad.push(s); return; }
      var nick=(toks.filter(function(x){ return x.replace(/\D/g,'')!==ph; })[0]
                || s.replace(/[\d\s]/g,'') || '匿名').slice(0,12);
      if(S.res.some(function(r){ return r.phone===ph; })){ dup++; return; }
      S.res.push({ rid:rid(), name:nick, phone:ph, device:'DEV-'+hex(8),
                   ts:now(), status:'reserved', payDeadline:null });
      ok++;
    });
    save();
    var cls = ok ? 'ok' : 'warn';
    var msg = '<div class="msg '+cls+'">导入成功 <b>'+ok+'</b> 条 ｜ 重复跳过 '+dup+' 条 ｜ 格式错误 '+bad.length+' 条';
    if(bad.length) msg += '：'+bad.slice(0,3).join(' / ')+(bad.length>3?' …':'');
    IMPMSG = msg + '</div>';
    render();
  };
  if(g('draw')) g('draw').onclick=function(){
    var valid=S.res.filter(function(r){return r.status==='reserved';}).map(byRid);
    var blob=sortedStr(valid);
    var seed=sha256(S.act.id+'|'+S.act.end+'|'+S.act.salt);
    var r=recompute(valid,seed,S.act.stock);
    S.res.forEach(function(x){
      if(r.winners.indexOf(x.rid)>=0){ x.status='won'; x.payDeadline=now()+payMs(); }
      else if(r.waitlist.indexOf(x.rid)>=0) x.status='waiting';
    });
    S.draw={ rosterBlob:blob, rosterHash:sha256(blob), seed:seed, drawTime:now(),
             rank:r.rank, winners:r.winners, waitlist:r.waitlist,
             validCount:valid.length, stock:S.act.stock };
    S.act.status='drawn'; save(); page='5'; render();
  };
  if(g('chk')) g('chk').onclick=function(){ releaseTimeout(); save(); render(); };
  if(g('exp')) g('exp').onclick=function(){
    var t=g('expText'), c=g('copy');
    if(!t) return;
    t.value=exportText(); t.style.display='block';
    if(c) c.style.display='inline-block';
  };
  if(g('copy')) g('copy').onclick=function(){
    var t=g('expText'); if(!t) return;
    t.style.display='block'; t.focus(); t.select();
    var done=false;
    try{ done=document.execCommand('copy'); }catch(e){ done=false; }
    if(!done && navigator.clipboard){ navigator.clipboard.writeText(t.value).then(function(){ alert('已复制到剪贴板'); }); return; }
    alert(done ? '已复制到剪贴板' : '复制失败，请手动按 Ctrl+C');
  };
  if(g('verify')) g('verify').onclick=function(){
    var r=recompute(S.draw.rank.slice().sort(), S.draw.seed, S.draw.stock);
    g('vm').innerHTML = JSON.stringify(r.winners)===JSON.stringify(S.draw.winners)
      ? '<div class="msg ok">一致：用公示输入重算，结果与公示中签名单完全相同</div>'
      : '<div class="msg err">不一致，请检查</div>';
  };
  document.querySelectorAll('[data-pay]').forEach(function(b){
    b.onclick=function(){ var x=findRid(b.dataset.pay); if(x){ payIt(x); render(); } };
  });
  document.querySelectorAll('[data-issue]').forEach(function(b){
    b.onclick=function(){ var x=findRid(b.dataset.issue); if(x){ x.issued=true; save(); render(); } };
  });
}

function bindModes(){
  var g=function(id){ return document.getElementById(id); };
  if(g('mUser')) g('mUser').onclick=function(){ mode='user'; render(); };
  if(g('mAdmin')) g('mAdmin').onclick=function(){ mode='admin'; render(); };
  if(g('mExit')) g('mExit').onclick=function(){ isAdmin=false; localStorage.removeItem('isAdmin'); mode='user'; render(); };
}

render();
setInterval(function(){ if(mode==='user' || page==='4') render(); }, 1000);
</script>
